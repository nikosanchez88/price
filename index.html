<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pricing Pro</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F2F2F7"> <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css?v=3.0" />
</head>
<body class="min-h-screen p-5 font-sans">
  
  <div class="max-w-md mx-auto space-y-6">
    
    <h1 class="text-2xl text-center pt-6">定价</h1>

    <div class="ios-card p-6 space-y-5 relative">
      
      <div>
        <label>汇率 (1 RMB = ? CLP)</label>
        <input id="rateInput" type="number" inputmode="decimal" step="0.01" placeholder="135" />
      </div>

      <div>
        <label>成本币种</label>
        <div class="currency-toggle">
          <button class="active" data-currency="RMB">RMB</button>
          <button data-currency="CLP">CLP</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label>商品成本</label>
          <input id="costInput" type="number" inputmode="decimal" placeholder="0" />
        </div>
        <div>
          <label>额外杂费</label>
          <input id="extraInput" type="number" inputmode="decimal" placeholder="0" />
        </div>
      </div>

      <div class="flex items-center justify-between pt-2">
        <span class="text-sm font-medium text-gray-900">含 19% IVA</span>
        <label class="switch">
          <input type="checkbox" id="taxToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="exchange-hint text-xs text-gray-400 text-center font-medium">
      当前汇率：未设置
    </div>

    <div class="ios-card">
      <div class="overflow-x-auto">
        <table>
          <thead>
            <tr>
              <th class="pl-6">策略</th>
              <th>CLP</th>
              <th>RMB</th>
              <th class="w-10"></th>
            </tr>
          </thead>
          <tbody id="priceRows"></tbody>
        </table>
      </div>
    </div>

    <div class="widget-dark">
      <h2 class="flex items-center gap-2 text-white font-bold text-lg">
        
        <span>反推利润</span>
      </h2>
      
      <div class="space-y-4">
        <div>
          <label>市场预期售价 (CLP)</label>
          <input id="targetPriceInput" type="number" inputmode="decimal" placeholder="输入价格..." />
        </div>

        <div id="reverseResult" class="hidden p-4 space-y-2">
          <div class="flex justify-between items-end">
            <span class="text-gray-400 text-sm">预估毛利率</span>
            <span id="revMargin" class="text-2xl font-bold">--%</span>
          </div>
          <div class="flex justify-between items-center text-sm">
            <span class="text-gray-400">净利润 (RMB)</span>
            <span id="revProfitRMB" class="font-mono text-white">--</span>
          </div>
          <div class="text-xs text-gray-500 mt-2 pt-2 border-t border-gray-600" id="revTaxHint">
            *计算结果说明
          </div>
        </div>
      </div>
    </div>

    <div class="text-center text-xs text-gray-400 pb-8 pt-2 opacity-60">
      Designed by You
    </div>
  </div>

  <script src="script.js"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }
  </script>
</body>
</html>
